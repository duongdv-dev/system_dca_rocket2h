x-base-service: &base-service
  build:
    context: .
    dockerfile: Dockerfile
  image: xauusd-grid-v6:latest
  volumes:
    - .:/app
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1

services:
  # Service Version 6 Phase 11: Monte Carlo Stress Test & Robustness Certification
  v6_phase11:
    <<: *base-service
    container_name: xauusd_v6_phase11
    command: python -u v6_system/run_phase11.py

  # Service Version 6 Phase 10: Walk-Forward Testing (Expanding Windows)
  v6_phase10:
    <<: *base-service
    container_name: xauusd_v6_phase10
    command: python -u v6_system/run_phase10.py

  # Service Version 6 Phase 9: AI Parameter Selection (Safe Grid Menu)
  v6_phase9:
    <<: *base-service
    container_name: xauusd_v6_phase9
    command: python -u v6_system/run_phase9.py

  # Service V4: Non-DCA Asian ORB Breakout 2020-2025
  v4_single_trade:
    <<: *base-service
    container_name: xauusd_single_trade_v4
    command: python -u v4_system/run_v4_backtest_2020_2025.py
