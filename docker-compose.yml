version: '3.8'

services:
  v2_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v2:latest
    container_name: xauusd_grid_v2_container
    volumes:
      # Mount thư mục dự án để đọc các file CSV nến M1 và xuất model.onnx/report
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v2_system/main_pipeline.py
