services:
  v3_advanced_training:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v3:latest
    container_name: xauusd_grid_v3_advanced_training
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v3_system/run_v3_advanced_training_pipeline.py

  v3_h2_2020_oos:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v3:latest
    container_name: xauusd_grid_v3_h2_2020_oos
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v3_system/run_h2_2020_oos_v3.py

  v3_h1_2020:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v3:latest
    container_name: xauusd_grid_v3_h1_2020
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v3_system/run_h1_2020_v3.py

  v3_jan2020:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v3:latest
    container_name: xauusd_grid_v3_jan2020
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v3_system/run_jan2020_v3.py

  v2_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: xauusd-grid-v2:latest
    container_name: xauusd_grid_v2_container
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: python -u v2_system/main_pipeline.py
