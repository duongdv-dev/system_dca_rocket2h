x-base-service: &base-service
  build:
    context: .
    dockerfile: Dockerfile
  image: xauusd-grid-v3:latest
  volumes:
    - .:/app
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1

services:
  # Service chính: Pipeline Walk-Forward 2020-2025 nâng cấp
  app:
    <<: *base-service
    container_name: xauusd_grid_v3_main
    command: python -u v3_system/run_v3_advanced_training_pipeline.py

  # Service V4 Mới: Chiến Lược 1 Lệnh Duy Nhất (Non-DCA Asian ORB Breakout 2020-2025)
  v4_single_trade:
    <<: *base-service
    container_name: xauusd_single_trade_v4
    command: python -u v4_system/run_v4_backtest_2020_2025.py

  # Service phụ: Backtest 6 tháng cuối 2020 OOS
  v3_h2_2020_oos:
    <<: *base-service
    container_name: xauusd_grid_v3_h2_2020_oos
    command: python -u v3_system/run_h2_2020_oos_v3.py

  # Service phụ: Backtest v2 legacy
  v2_pipeline:
    <<: *base-service
    container_name: xauusd_grid_v2_pipeline
    command: python -u v2_system/main_pipeline.py
